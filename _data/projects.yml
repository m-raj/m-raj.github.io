- title: "Local strain fields in composites with UNet"
  url: "/projects/strain-field-unet/"
  description: "A UNet maps a whole 3D two-phase microstructure to its full strain field (R² ≈ 94% on unseen samples), with a statistical analysis of where and why it errs."
  image_src: projects/strain-field-unet/fig06.png
  venue: IMMI
  year: 2021
  tags: [Deep learning, Microstructure]

- title: "PINNs for thermo-mechanics of graded materials"
  url: "/projects/pinn-thermomechanics/"
  description: "Energy-based physics-informed networks solve coupled thermo-elastic problems in graded materials with R² > 99% on displacement and temperature, and show why stresses are harder."
  image_src: projects/pinn-thermomechanics/thumb.png
  venue: arXiv
  year: 2021
  tags: [PINNs, Thermo-elasticity]

- title: "Mechanical properties of nacre-like composites"
  url: "/projects/nacre-composites/"
  description: "Molecular dynamics puts the shear modulus of nacre's protein matrix at 1.25–1.45 GPa; 3D finite-element models then show 10–20% organic content maximises toughness."
  image_src: projects/nacre-composites/fig02.png
  venue: J. Compos. Sci.
  year: 2020
  tags: [Molecular dynamics, FEM, Bio-inspired]

